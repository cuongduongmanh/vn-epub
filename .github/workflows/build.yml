name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish never
        env:
          # macOS: đặt CSC_LINK/CSC_KEY_PASSWORD (+ APPLE_ID...) trong Secrets nếu muốn ký & notarize.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg

  release:
    # Chỉ tạo GitHub Release khi push tag v*, dùng GITHUB_TOKEN có sẵn của Actions.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: VN EPUB Maker ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist-installers/*
